<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎓 Student Management System</h1>

  <!-- Form لإضافة طالب -->
  <form id="studentForm">
    <input type="text" id="firstName" placeholder="الاسم الأول" required>
    <input type="text" id="lastName" placeholder="الاسم الأخير" required>
    <input type="email" id="email" placeholder="الإيميل" required>
    <input type="password" id="passwordHash" placeholder="الباسورد" required>
    <button type="submit">➕ إضافة طالب</button>
  </form>

  <!-- جدول عرض الطلاب -->
  <table id="studentsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>الاسم الأول</th>
        <th>الاسم الأخير</th>
        <th>الإيميل</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
